<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Lantern Market</title>
<meta name="description" content="Run a night food market. Cook, hire helpers, and take your stalls from city to city.">
<meta name="theme-color" content="#140d2b">
<meta property="og:title" content="Lantern Market">
<meta property="og:description" content="Run a night food market. Cook, hire helpers, and take your stalls from city to city.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23140d2b'/%3E%3Cpath d='M32 8v8' stroke='%23ffcf70' stroke-width='3'/%3E%3Cellipse cx='32' cy='36' rx='16' ry='19' fill='%23ff6b4a'/%3E%3Cpath d='M22 20h20M22 52h20' stroke='%23ffcf70' stroke-width='4'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#140d2b; --bg2:#1d1440; --card:#251a4f; --card2:#2e2160; --line:rgba(255,255,255,.1);
    --text:#fff6ea; --muted:#b9acd9; --gold:#ffcf70; --lantern:#ff6b4a; --green:#5be3a1; --red:#ff6b7f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--text);
    font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  body{display:flex;flex-direction:column;max-width:560px;margin:0 auto;overflow:hidden}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

  /* top: money + scene */
  #top{position:relative;padding:calc(10px + env(safe-area-inset-top)) 16px 0;background:linear-gradient(#0d0820,var(--bg))}
  #cashRow{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  #cash{font-size:32px;font-weight:900;letter-spacing:.3px}
  #rate{color:var(--muted);font-size:14px;font-weight:700}
  #festBtn{flex-shrink:0;padding:8px 12px;border-radius:12px;background:var(--lantern);color:#2a0c00;font-weight:800;font-size:13px;line-height:1.15;text-align:center}
  #festBtn.on{background:var(--gold)}
  #scene{position:relative;height:74px;margin:8px -16px 0;overflow:hidden}
  #wire{position:absolute;left:0;right:0;top:4px;height:30px}
  .lan{position:absolute;top:10px;width:16px;height:20px;border-radius:50%/45%;transform-origin:50% -10px;animation:sway 3s ease-in-out infinite alternate}
  .lan::before{content:"";position:absolute;left:3px;right:3px;top:-3px;height:3px;background:#3b2a12;border-radius:2px}
  .lan::after{content:"";position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(circle,rgba(255,180,80,.35),transparent 70%)}
  @keyframes sway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
  #street{position:absolute;left:0;right:0;bottom:0;height:34px}
  .walker{position:absolute;bottom:4px;font-size:22px;left:-40px;animation:walk linear forwards;white-space:nowrap}
  .walker small{font-size:14px;margin-left:-6px;vertical-align:top}
  @keyframes walk{to{left:calc(100% + 40px)}}
  .walker.l{animation-name:walkL;left:calc(100% + 40px)}
  @keyframes walkL{to{left:-40px}}

  /* tabs */
  #tabs{display:flex;gap:6px;padding:8px 12px;background:var(--bg)}
  .tab{flex:1;padding:9px 4px;border-radius:12px;font-weight:800;font-size:14px;color:var(--muted);background:rgba(255,255,255,.04)}
  .tab.on{color:var(--text);background:var(--card2)}
  .tab .n{color:var(--gold)}

  #main{flex:1;overflow-y:auto;padding:4px 12px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
  .modes{display:flex;gap:6px;margin:2px 0 8px}
  .mode{flex:1;padding:6px;border-radius:10px;font-weight:800;font-size:13px;background:rgba(255,255,255,.05);color:var(--muted)}
  .mode.on{background:var(--gold);color:#2a1a00}

  .stall{position:relative;display:flex;align-items:center;gap:10px;padding:10px;margin-bottom:8px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
  .stall.dish{border-color:rgba(255,207,112,.55)}
  .icon{position:relative;flex-shrink:0;width:58px;height:58px;border-radius:14px;background:var(--card2);font-size:32px;display:flex;align-items:center;justify-content:center;transition:transform .08s}
  .icon:active{transform:scale(.92)}
  .icon.idle{box-shadow:0 0 0 2px var(--gold) inset;animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 2px rgba(255,207,112,.25) inset}}
  .lv{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:#0d0820;border:1px solid var(--line);border-radius:8px;padding:0 6px;font-size:12px;font-weight:800}
  .mid{flex:1;min-width:0}
  .name{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .name em{font-style:normal;color:var(--gold);font-size:12px;margin-left:4px}
  .bar{position:relative;height:22px;margin-top:5px;border-radius:8px;background:rgba(0,0,0,.35);overflow:hidden}
  .bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#ff8a4a,var(--gold))}
  .bar.fast i{width:100%;background:repeating-linear-gradient(90deg,#ff8a4a 0 14px,var(--gold) 14px 28px);animation:slide .5s linear infinite;background-size:28px 100%}
  @keyframes slide{to{background-position:28px 0}}
  .bar span{position:relative;display:block;text-align:center;font-size:13px;font-weight:800;line-height:22px;text-shadow:0 1px 2px rgba(0,0,0,.6)}
  .sub{margin-top:4px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
  .buy{flex-shrink:0;width:96px;padding:8px 4px;border-radius:12px;background:var(--green);color:#002814;line-height:1.15}
  .buy b{display:block;font-size:13px}
  .buy span{display:block;font-size:14px;font-weight:800}
  .buy:disabled{background:rgba(255,255,255,.08);color:var(--muted);cursor:default}
  .stall.locked{opacity:.85}
  .stall.locked .icon{filter:grayscale(1) brightness(.6)}
  .stall.hidden .icon,.stall.hidden .name{filter:blur(5px)}
  .pop{position:absolute;left:44px;top:4px;font-weight:900;color:var(--gold);font-size:14px;pointer-events:none;animation:pop .9s ease-out forwards}
  @keyframes pop{to{transform:translateY(-26px);opacity:0}}

  .row{display:flex;align-items:center;gap:10px;padding:12px;margin-bottom:8px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
  .row .em{font-size:28px;width:40px;text-align:center}
  .row .t{flex:1;min-width:0}
  .row .t b{display:block;font-size:15px}
  .row .t small{color:var(--muted);font-size:12.5px}
  .row .buy{width:104px;padding:10px 4px;font-weight:800;font-size:14px}
  .done{color:var(--green);font-weight:800;font-size:13px;width:104px;text-align:center}
  .section{color:var(--muted);font-size:13px;font-weight:800;margin:14px 4px 8px;text-transform:uppercase;letter-spacing:.6px}
  .city{padding:18px;border-radius:18px;background:linear-gradient(135deg,var(--card2),var(--card));border:1px solid var(--line);text-align:center}
  .city h2{font-size:24px}
  .city p{color:var(--muted);font-size:14px;margin-top:6px;line-height:1.4}
  .big{display:block;width:100%;margin-top:12px;padding:14px;border-radius:14px;font-weight:900;font-size:16px;background:var(--gold);color:#2a1a00}
  .big:disabled{background:rgba(255,255,255,.08);color:var(--muted)}
  .big.ad{background:var(--lantern);color:#2a0c00}
  .big small{display:block;font-size:12px;font-weight:700;opacity:.8}
  .link{display:block;margin:16px auto 0;color:var(--muted);font-size:13px}

  #modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(8,5,20,.7);backdrop-filter:blur(3px);z-index:5}
  #modal.on{display:flex}
  #modal .card{width:100%;max-width:360px;padding:24px 20px;border-radius:22px;background:var(--bg2);border:1px solid var(--line);text-align:center}
  #modal .em{font-size:44px}
  #modal h3{font-size:21px;margin-top:6px}
  #modal p{color:var(--muted);margin-top:6px;line-height:1.4}
  #modal .amt{font-size:30px;font-weight:900;color:var(--gold);margin-top:10px}
  #modal .btn2{display:block;width:100%;margin-top:10px;padding:13px;border-radius:14px;font-weight:800;background:rgba(255,255,255,.08)}
  #ad{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:#000;z-index:10;text-align:center;padding:16px}
  #ad.on{display:flex}
  #ad .t{font-size:13px;color:#888}
  #ad .n{font-size:40px;font-weight:900}
  #toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:12px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;z-index:6;white-space:nowrap}
</style>
</head>
<body>
<div id="top">
  <div id="cashRow">
    <div><div id="cash">$0</div><div id="rate">$0 / sec</div></div>
    <button id="festBtn">🏮 Festival<br>×2 income</button>
  </div>
  <div id="scene"><div id="wire"></div><div id="street"></div></div>
</div>
<div id="tabs">
  <button class="tab on" data-tab="stalls">Stalls</button>
  <button class="tab" data-tab="helpers">Helpers</button>
  <button class="tab" data-tab="upgrades">Upgrades</button>
  <button class="tab" data-tab="city">City</button>
</div>
<div id="main"></div>

<div id="modal"><div class="card" id="modalCard"></div></div>
<div id="ad"><div class="t">AD PLACEHOLDER</div><div class="n" id="adN">3</div><div class="t">A portal ad (CrazyGames / Poki) plays here</div></div>
<div id="toast"></div>

<script>
(() => {
'use strict';

/* ---------- Portal / ads adapter (same contract as Orbit Courier) ---------- */
const Portal = {
  gameplayStart(){}, gameplayStop(){},
  rewarded(){ return fakeAd(); },
  interstitial(){ return fakeAd(); },
};
function fakeAd(){
  return new Promise(res => {
    const el = $('ad'), n = $('adN'); let s = 3; n.textContent = s; el.classList.add('on');
    const iv = setInterval(() => { s--; n.textContent = s; if (s <= 0){ clearInterval(iv); el.classList.remove('on'); res(true); } }, 1000);
  });
}

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
const SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
function fmt(n){
  if (!isFinite(n)) return '∞';
  if (n < 1000) return n < 100 && n % 1 ? n.toFixed(n < 10 ? 2 : 1).replace(/\.?0+$/, '') : String(Math.floor(n));
  const e = Math.floor(Math.log10(n) / 3);
  const s = e < SUF.length ? SUF[e] : String.fromCharCode(97 + Math.floor((e - SUF.length) / 26)) + String.fromCharCode(97 + (e - SUF.length) % 26);
  const v = n / Math.pow(10, 3 * e);
  return v.toFixed(v < 100 ? 2 : 1).replace(/\.?0+$/, '') + s;
}
const money = n => '$' + fmt(n);
function dur(s){
  s = Math.max(0, Math.floor(s));
  if (s < 60) return s + 's';
  if (s < 3600) return Math.floor(s / 60) + 'm ' + String(s % 60).padStart(2, '0') + 's';
  return Math.floor(s / 3600) + 'h ' + String(Math.floor(s % 3600 / 60)).padStart(2, '0') + 'm';
}
function dayKey(d = new Date()){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function hash(str){ let h = 2166136261; for (const c of str){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function toast(msg){ const t = $('toast'); t.textContent = msg; t.style.opacity = 1; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.opacity = 0, 1700); }

/* ---------- Content ---------- */
// c0 first cost, k cost growth per level, t seconds per batch, r takings per batch per level, h helper cost
const STALLS = [
  { name: 'Roasted Corn', e: '🌽', c0: 4,     k: 1.07,  t: 1,   r: 1,     h: 1000,   helper: 'Ama' },
  { name: 'Skewers',      e: '🍢', c0: 70,    k: 1.15,  t: 3,   r: 30,    h: 20e3,   helper: 'Somchai' },
  { name: 'Dumplings',    e: '🥟', c0: 1.4e3, k: 1.14,  t: 8,   r: 300,   h: 400e3,  helper: 'Mei' },
  { name: 'Noodles',      e: '🍜', c0: 28e3,  k: 1.13,  t: 20,  r: 3.5e3, h: 7e6,    helper: 'Mehmet' },
  { name: 'Tacos',        e: '🌮', c0: 600e3, k: 1.12,  t: 45,  r: 40e3,  h: 150e6,  helper: 'Lupe' },
  { name: 'Bubble Tea',   e: '🧋', c0: 13e6,  k: 1.115, t: 110, r: 480e3, h: 600e6,  helper: 'Ji-woo' },
  { name: 'Pizza Slices', e: '🍕', c0: 300e6, k: 1.11,  t: 260, r: 5.5e6, h: 15e9,   helper: 'Rosa' },
  { name: 'Sushi Bar',    e: '🍣', c0: 7e9,   k: 1.10,  t: 600, r: 64e6,  h: 350e9,  helper: 'Hiro' },
];
const N = STALLS.length;
const MILESTONES = [25, 50, 100, 150, 200, 300, 400, 500];   // each doubles a stall's takings
const SPEED_AT = [25, 50, 100];                                  // these also halve cooking time
const CITIES = ['Nairobi', 'Bangkok', 'Mexico City', 'Istanbul', 'Seoul', 'Lagos', 'Naples', 'Osaka', 'Lima', 'Marrakesh', 'Hanoi', 'Rio'];
const UPNAMES = ['Secret spice', 'Bigger grill', 'Family recipe', 'Neon sign', 'Famous chef'];
const GLOBAL_UPS = ['String lights', 'Live music', 'Food critic visit', 'TV feature', 'Street festival', 'World food guide'];
const UPGRADES = [];
STALLS.forEach((s, i) => UPNAMES.forEach((u, k) => UPGRADES.push({ id: `s${i}k${k}`, stall: i, mult: 3, cost: s.c0 * 1e4 * Math.pow(100, k) * (1 + i), name: u, e: s.e, what: `${s.name} takings ×3` })));
GLOBAL_UPS.forEach((u, k) => UPGRADES.push({ id: 'g' + k, stall: -1, mult: 2, cost: 1e7 * Math.pow(1e4, k), name: u, e: '🏮', what: 'Every stall ×2' }));
UPGRADES.sort((a, b) => a.cost - b.cost);
const FAME_PER = 0.04;          // each fame star: +4% income, forever
const FAME_DIV = 16e6;          // fame for a run = floor(sqrt(earned this city / FAME_DIV))
const OFFLINE_CAP = 8 * 3600;
const FEST_STEP = 15 * 60, FEST_MAX = 2 * 3600;   // seconds; festUntil is a ms timestamp

/* ---------- State ---------- */
const SAVE_KEY = 'lanternmarket.v1';
function freshRun(){ return { cash: 0, runEarned: 0, lv: [1, 0, 0, 0, 0, 0, 0, 0], help: Array(N).fill(false), prog: Array(N).fill(0), cooking: Array(N).fill(false), ups: {} }; }
let S = Object.assign({ fame: 0, city: 0, allEarned: 0, festUntil: 0, lastSeen: Date.now(), streak: 0, lastGift: '', muted: false, mode: 1, started: Date.now() }, freshRun());
try { const saved = JSON.parse(localStorage.getItem(SAVE_KEY)); if (saved) S = Object.assign(S, saved); } catch(e){}
function persist(){ S.lastSeen = Date.now(); try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch(e){} }

/* ---------- Economy ---------- */
let now = Date.now();               // the debug sim moves this clock itself
const festivalOn = () => S.festUntil > now;
const dishIdx = () => hash(dayKey()) % N;
const msCount = L => MILESTONES.filter(m => L >= m).length;
const nextMilestone = L => MILESTONES.find(m => L < m);
function upMult(i){ let m = 1; for (const u of UPGRADES) if (S.ups[u.id] && (u.stall === i || u.stall === -1)) m *= u.mult; return m; }
function globalMult(){ return (1 + FAME_PER * S.fame) * (festivalOn() ? 2 : 1); }
function cycleTime(i){ let t = STALLS[i].t; for (const m of SPEED_AT) if (S.lv[i] >= m) t /= 2; return t; }
function takings(i, lv = S.lv[i]){ if (!lv) return 0; return STALLS[i].r * lv * Math.pow(2, msCount(lv)) * upMult(i) * globalMult() * (dishIdx() === i ? 3 : 1); }
function ratePerSec(i){ return takings(i) / cycleTime(i); }
function totalRate(){ let r = 0; for (let i = 0; i < N; i++) if (S.help[i] && S.lv[i]) r += ratePerSec(i); return r; }
function costFor(i, n){ const s = STALLS[i]; return s.c0 * Math.pow(s.k, S.lv[i]) * (Math.pow(s.k, n) - 1) / (s.k - 1); }
function maxAffordable(i){ const s = STALLS[i]; const base = s.c0 * Math.pow(s.k, S.lv[i]); return Math.max(0, Math.floor(Math.log(S.cash * (s.k - 1) / base + 1) / Math.log(s.k))); }
function buyCount(i){
  if (!S.lv[i]) return 1;                          // first purchase unlocks the stall
  if (S.mode === 'max') return Math.max(1, maxAffordable(i));
  if (S.mode === 'next'){ const m = nextMilestone(S.lv[i]); return m ? m - S.lv[i] : 1; }
  return S.mode;
}
const pendingFame = () => Math.floor(Math.sqrt(S.runEarned / FAME_DIV));

function earn(v){ S.cash += v; S.runEarned += v; S.allEarned += v; }
function buyLevels(i, n){
  n = n || buyCount(i);
  const c = costFor(i, n);
  if (c > S.cash || n < 1) return false;
  const before = S.lv[i];
  S.cash -= c; S.lv[i] += n;
  if (msCount(S.lv[i]) > msCount(before) && before > 0){ toast(`${STALLS[i].e} ${STALLS[i].name} hit ${MILESTONES[msCount(S.lv[i]) - 1]}: takings ×2!`); sfx.milestone(); }
  else sfx.buy();
  return true;
}
function hire(i){
  if (S.help[i] || !S.lv[i] || S.cash < STALLS[i].h) return false;
  S.cash -= STALLS[i].h; S.help[i] = true; sfx.milestone(); return true;
}
function buyUpgrade(id){
  const u = UPGRADES.find(x => x.id === id);
  if (!u || S.ups[id] || S.cash < u.cost) return false;
  S.cash -= u.cost; S.ups[id] = true; sfx.milestone(); return true;
}
function cook(i){ if (S.lv[i] && !S.help[i] && !S.cooking[i]){ S.cooking[i] = true; sfx.tap(); return true; } return false; }
function moveCity(){
  const f = pendingFame(); if (f < 1) return false;
  S.fame += f; S.city++;
  Object.assign(S, freshRun());
  return true;
}

/* ---------- Simulation step ---------- */
const saleFx = Array(N).fill(0);
function update(dt){
  now += dt * 1000;
  for (let i = 0; i < N; i++){
    if (!S.lv[i]) continue;
    if (!S.help[i] && !S.cooking[i]) continue;
    const T = cycleTime(i);
    S.prog[i] += dt;
    if (S.prog[i] >= T){
      const n = S.help[i] ? Math.floor(S.prog[i] / T) : 1;
      const v = takings(i) * n;
      earn(v);
      S.prog[i] = S.help[i] ? S.prog[i] - n * T : 0;
      if (!S.help[i]) S.cooking[i] = false;
      saleFx[i] += v;
    }
  }
}

/* ---------- Sound ---------- */
let AC = null, lastTick = 0;
function tone(f, d = .08, type = 'sine', v = .05, slide = 0){
  if (S.muted) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .02);
  } catch(e){}
}
const sfx = {
  tap(){ tone(520, .06, 'triangle', .05); },
  coin(){ const t = performance.now(); if (t - lastTick < 140) return; lastTick = t; tone(1200 + Math.random() * 300, .05, 'square', .02); },
  buy(){ tone(660, .07, 'triangle', .05); setTimeout(() => tone(880, .08, 'triangle', .05), 50); },
  milestone(){ [660, 880, 1100].forEach((f, k) => setTimeout(() => tone(f, .12, 'triangle', .06), k * 70)); },
};

/* ---------- Scene: lanterns + customers ---------- */
(function buildLanterns(){
  const w = $('wire'); const colors = ['#ff6b4a', '#ffcf70', '#ff8fb1', '#ff6b4a', '#7ee0ff', '#ffcf70'];
  w.innerHTML = '<svg width="100%" height="30" preserveAspectRatio="none" viewBox="0 0 100 30" style="position:absolute;inset:0"><path d="M0 4 Q25 16 50 8 T100 6" stroke="#4a3a6a" stroke-width=".6" fill="none" vector-effect="non-scaling-stroke"/></svg>';
  for (let k = 0; k < 9; k++){
    const l = document.createElement('i'); l.className = 'lan';
    l.style.left = (5 + k * 11) + '%'; l.style.top = (8 + Math.sin(k * 1.3) * 3) + 'px';
    l.style.background = colors[k % colors.length]; l.style.animationDelay = (-k * .4) + 's';
    w.appendChild(l);
  }
})();
const PEOPLE = ['🧑', '👩', '👨', '🧕', '👵', '🧔', '👧', '👱', '👴', '🧑‍🦱', '👩‍🦰', '🧑‍🦳'];
let lastWalker = 0;
function walker(food){
  const t = performance.now(); if (t - lastWalker < 650 || $('street').childElementCount > 9) return; lastWalker = t;
  const d = document.createElement('div');
  d.className = 'walker' + (Math.random() < .5 ? ' l' : '');
  d.innerHTML = PEOPLE[Math.floor(Math.random() * PEOPLE.length)] + '<small>' + food + '</small>';
  d.style.animationDuration = (5 + Math.random() * 4) + 's';
  d.style.bottom = (2 + Math.random() * 8) + 'px';
  d.addEventListener('animationend', () => d.remove());
  $('street').appendChild(d);
}

/* ---------- UI ---------- */
let tab = 'stalls';
const main = $('main');

function renderStalls(){
  const modes = [1, 10, 100, 'next', 'max'];
  let html = '<div class="modes">' + modes.map(m => `<button class="mode${S.mode === m ? ' on' : ''}" data-mode="${m}">${m === 'max' ? 'Max' : m === 'next' ? 'Next ★' : '×' + m}</button>`).join('') + '</div>';
  const firstLocked = S.lv.findIndex(l => !l);
  STALLS.forEach((s, i) => {
    if (!S.lv[i] && firstLocked >= 0 && i > firstLocked + 1) return;
    const hidden = !S.lv[i] && i > firstLocked;
    html += `<div class="stall${S.lv[i] ? '' : ' locked'}${hidden ? ' hidden' : ''}${dishIdx() === i ? ' dish' : ''}" id="st${i}">
      <button class="icon" data-cook="${i}">${s.e}<span class="lv" id="lv${i}"></span></button>
      <div class="mid">
        <div class="name">${hidden ? 'Coming soon' : s.name}${dishIdx() === i ? '<em>★ Dish of the day ×3</em>' : ''}</div>
        <div class="bar" id="bar${i}"><i id="fill${i}"></i><span id="earn${i}"></span></div>
        <div class="sub"><span id="sub${i}"></span><span id="time${i}"></span></div>
      </div>
      <button class="buy" data-buy="${i}" id="buy${i}"><b id="buyN${i}"></b><span id="buyC${i}"></span></button>
    </div>`;
  });
  main.innerHTML = html;
}

function renderHelpers(){
  let html = '<div class="section">Helpers cook for you, even while you\'re away</div>';
  STALLS.forEach((s, i) => {
    if (!S.lv[i]) return;
    html += `<div class="row"><div class="em">${s.e}</div><div class="t"><b>${s.helper}</b><small>Runs your ${s.name} stall</small></div>` +
      (S.help[i] ? '<div class="done">Hired</div>' : `<button class="buy" data-hire="${i}" id="hire${i}">${money(s.h)}</button>`) + '</div>';
  });
  main.innerHTML = html;
}

function renderUpgrades(){
  const open = UPGRADES.filter(u => !S.ups[u.id] && (u.stall < 0 || S.lv[u.stall])).slice(0, 10);
  let html = '<div class="section">Upgrades</div>';
  if (!open.length) html += '<p class="link">Nothing left to buy here. Time to move city?</p>';
  for (const u of open) html += `<div class="row"><div class="em">${u.e}</div><div class="t"><b>${u.name}</b><small>${u.what}</small></div><button class="buy" data-up="${u.id}">${money(u.cost)}</button></div>`;
  main.innerHTML = html;
}

function renderCity(){
  const f = pendingFame();
  const city = CITIES[S.city % CITIES.length] + (S.city >= CITIES.length ? ' ' + (Math.floor(S.city / CITIES.length) + 1) : '');
  const nextCity = CITIES[(S.city + 1) % CITIES.length];
  const giftReady = S.lastGift !== dayKey();
  main.innerHTML = `
    <div class="city">
      <h2>📍 ${city}</h2>
      <p>Fame: <b>${S.fame} ★</b> · every star adds ${FAME_PER * 100}% to all income, forever.</p>
      <p>Moving to <b>${nextCity}</b> now earns <b id="pf">${f} ★</b>. You start fresh with your stalls, but your fame comes with you.</p>
      <button class="big" id="moveBtn" ${f < 1 ? 'disabled' : ''}>Move to ${nextCity}<small id="moveSub">${f < 1 ? 'Earn ' + money(FAME_DIV) + ' here for your first star' : '+' + f + ' ★ → ' + Math.round(FAME_PER * 100 * (S.fame + f)) + '% bonus'}</small></button>
    </div>
    <div class="section">Today</div>
    <div class="row"><div class="em">🎁</div><div class="t"><b>Daily gift</b><small>${giftReady ? 'Day ' + nextStreak() + ' streak: ' + money(giftAmount()) : 'Come back tomorrow for day ' + (S.streak + 1)}</small></div>${giftReady ? '<button class="buy" id="giftBtn">Open</button>' : '<div class="done">Opened</div>'}</div>
    <div class="row"><div class="em">${STALLS[dishIdx()].e}</div><div class="t"><b>Dish of the day</b><small>${STALLS[dishIdx()].name} earns ×3 today</small></div></div>
    <div class="section">Stats</div>
    <div class="row"><div class="em">💰</div><div class="t"><b>${money(S.allEarned)}</b><small>earned in all cities</small></div></div>
    <button class="link" id="muteBtn">Sound: ${S.muted ? 'off' : 'on'}</button>`;
}

function nextStreak(){ const y = dayKey(new Date(Date.now() - 864e5)); return S.lastGift === y ? Math.min(S.streak + 1, 7) : 1; }
function giftAmount(){ return Math.max(50, totalRate() * 90 * nextStreak(), costFor(0, 1) * 10); }

function render(){
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  ({ stalls: renderStalls, helpers: renderHelpers, upgrades: renderUpgrades, city: renderCity })[tab]();
  refresh();
}

function refresh(){
  $('cash').textContent = money(S.cash);
  $('rate').textContent = money(totalRate()) + ' / sec' + (S.fame ? ` · ${S.fame} ★` : '');
  const fb = $('festBtn');
  if (festivalOn()){ fb.classList.add('on'); fb.innerHTML = `🏮 ×2 on<br>${dur((S.festUntil - now) / 1000)}`; }
  else { fb.classList.remove('on'); fb.innerHTML = '🏮 Festival<br>×2 income'; }

  // badges on tabs
  const hires = STALLS.filter((s, i) => S.lv[i] && !S.help[i] && S.cash >= s.h).length;
  const ups = UPGRADES.filter(u => !S.ups[u.id] && (u.stall < 0 || S.lv[u.stall]) && S.cash >= u.cost).length;
  const tabEl = t => document.querySelector(`.tab[data-tab="${t}"]`);
  tabEl('helpers').innerHTML = 'Helpers' + (hires ? ` <span class="n">${hires}</span>` : '');
  tabEl('upgrades').innerHTML = 'Upgrades' + (ups ? ` <span class="n">${ups}</span>` : '');
  tabEl('city').innerHTML = 'City' + (S.lastGift !== dayKey() ? ' <span class="n">🎁</span>' : '');

  if (tab === 'stalls'){
    for (let i = 0; i < N; i++){
      const buy = $('buy' + i); if (!buy) continue;
      const n = buyCount(i), c = costFor(i, n);
      $('lv' + i).textContent = S.lv[i] || '';
      $('buyN' + i).textContent = S.lv[i] ? 'Buy ×' + n : 'Open stall';
      $('buyC' + i).textContent = money(c);
      buy.disabled = c > S.cash;
      const icon = buy.parentElement.querySelector('.icon');
      icon.classList.toggle('idle', !!S.lv[i] && !S.help[i] && !S.cooking[i]);
      if (S.lv[i]){
        const T = cycleTime(i);
        $('earn' + i).textContent = money(takings(i));
        $('time' + i).textContent = T < 1 ? T.toFixed(2) + 's' : dur(T);
        const nm = nextMilestone(S.lv[i]);
        $('sub' + i).textContent = S.help[i] ? (nm ? `×2 at ${nm}` : 'Fully grown') : 'Tap to cook';
      } else {
        $('earn' + i).textContent = ''; $('time' + i).textContent = ''; $('sub' + i).textContent = '';
      }
    }
  } else if (tab === 'helpers'){
    STALLS.forEach((s, i) => { const b = $('hire' + i); if (b) b.disabled = S.cash < s.h; });
  } else if (tab === 'upgrades'){
    main.querySelectorAll('[data-up]').forEach(b => { b.disabled = S.cash < UPGRADES.find(u => u.id === b.dataset.up).cost; });
  } else if (tab === 'city'){
    const f = pendingFame(), pf = $('pf'), mb = $('moveBtn');
    if (pf && pf.textContent !== f + ' ★'){ render(); return; }
    if (mb) mb.disabled = f < 1;
  }
}

function drawBars(){
  if (tab !== 'stalls') return;
  for (let i = 0; i < N; i++){
    const fill = $('fill' + i); if (!fill || !S.lv[i]) continue;
    const T = cycleTime(i), fast = S.help[i] && T < .3;
    $('bar' + i).classList.toggle('fast', fast);
    if (!fast) fill.style.width = (S.cooking[i] || S.help[i] ? Math.min(1, S.prog[i] / T) * 100 : 0) + '%';
    if (saleFx[i]){
      if (T >= .6){
        const p = document.createElement('span'); p.className = 'pop'; p.textContent = '+' + money(saleFx[i]);
        p.addEventListener('animationend', () => p.remove()); $('st' + i).appendChild(p);
      }
      walker(STALLS[i].e); sfx.coin();
    }
  }
  saleFx.fill(0);
}

/* ---------- Modals ---------- */
function modal(html){ $('modalCard').innerHTML = html; $('modal').classList.add('on'); }
function closeModal(){ $('modal').classList.remove('on'); }

function offlineReturn(){
  const away = Math.min((Date.now() - (S.lastSeen || Date.now())) / 1000, OFFLINE_CAP);
  if (away < 60) return;
  const savedFest = S.festUntil; S.festUntil = 0;           // the festival only counts while you're playing
  const gained = totalRate() * away;
  S.festUntil = savedFest;
  if (gained <= 0) return;
  earn(gained);
  modal(`<div class="em">🏮</div><h3>Welcome back!</h3><p>You were away ${dur(away)}. Your helpers kept cooking.</p>
    <div class="amt">+${money(gained)}</div>
    <button class="big ad" id="dblBtn">Double it<small>Watch a short ad</small></button>
    <button class="btn2" id="okBtn">Collect</button>`);
  $('okBtn').onclick = closeModal;
  $('dblBtn').onclick = async () => { closeModal(); if (await Portal.rewarded()){ earn(gained); toast('Doubled: +' + money(gained)); persist(); } };
}

async function festival(){
  if (S.festUntil - now > (FEST_MAX - FEST_STEP) * 1000){ toast('The festival is already in full swing'); return; }
  modal(`<div class="em">🏮</div><h3>Lantern Festival</h3><p>Watch a short ad and every stall earns double for ${FEST_STEP / 60} minutes. Watch more to stack up to ${FEST_MAX / 3600} hours.</p>
    <button class="big ad" id="festGo">Start the festival<small>Watch a short ad</small></button><button class="btn2" id="okBtn">Not now</button>`);
  $('okBtn').onclick = closeModal;
  $('festGo').onclick = async () => {
    closeModal();
    if (await Portal.rewarded()){ S.festUntil = Math.max(S.festUntil, now) + FEST_STEP * 1000; sfx.milestone(); toast('Festival on: ×2 income!'); persist(); render(); }
  };
}

function openGift(){
  if (S.lastGift === dayKey()) return;
  const amt = giftAmount(), streak = nextStreak();
  earn(amt); S.streak = streak; S.lastGift = dayKey(); persist(); sfx.milestone();
  modal(`<div class="em">🎁</div><h3>Day ${streak} gift</h3><p>${streak < 7 ? 'Come back tomorrow and it grows.' : 'Maximum streak: keep it going!'}</p><div class="amt">+${money(amt)}</div><button class="big" id="okBtn">Nice</button>`);
  $('okBtn').onclick = () => { closeModal(); render(); };
}

function confirmMove(){
  const f = pendingFame(); if (f < 1) return;
  const nextCity = CITIES[(S.city + 1) % CITIES.length];
  modal(`<div class="em">✈️</div><h3>Move to ${nextCity}?</h3><p>You'll start over with one corn stall and no cash. You keep your ${S.fame} ★ and gain <b>${f} ★</b> more: <b>+${Math.round(FAME_PER * 100 * (S.fame + f))}%</b> income from now on.</p>
    <button class="big" id="goBtn">Pack the stalls</button><button class="btn2" id="okBtn">Stay here</button>`);
  $('okBtn').onclick = closeModal;
  $('goBtn').onclick = async () => {
    closeModal(); await Portal.interstitial();
    if (moveCity()){ persist(); tab = 'stalls'; render(); toast(`Welcome to ${CITIES[S.city % CITIES.length]}!`); sfx.milestone(); }
  };
}

/* ---------- Input ---------- */
document.querySelectorAll('.tab').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); main.scrollTop = 0; });
main.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.mode){ S.mode = isNaN(+t.dataset.mode) ? t.dataset.mode : +t.dataset.mode; render(); return; }
  if (t.dataset.cook !== undefined){ cook(+t.dataset.cook); return; }
  if (t.dataset.buy !== undefined){ const i = +t.dataset.buy, was = S.lv[i]; if (buyLevels(i)){ if (!was) render(); else refresh(); } return; }
  if (t.dataset.hire !== undefined){ if (hire(+t.dataset.hire)){ toast(`${STALLS[+t.dataset.hire].helper} is cooking for you now`); render(); } return; }
  if (t.dataset.up){ if (buyUpgrade(t.dataset.up)) render(); return; }
  if (t.id === 'moveBtn') confirmMove();
  if (t.id === 'giftBtn') openGift();
  if (t.id === 'muteBtn'){ S.muted = !S.muted; persist(); render(); }
});
$('festBtn').onclick = festival;
document.addEventListener('visibilitychange', () => { if (document.hidden) persist(); else { now = Date.now(); offlineReturn(); } });
addEventListener('pagehide', persist);

/* ---------- Loop ---------- */
let last = performance.now(), uiT = 0, saveT = 0;
let loggedErr = false;
function frame(t){
  requestAnimationFrame(frame);                 // schedule first, so one bad frame can never freeze the game
  const dt = Math.min((t - last) / 1000, .25); last = t;
  try {
    if (!sim) update(dt);
    drawBars();
    uiT += dt; if (uiT > .2){ uiT = 0; refresh(); }
    saveT += dt; if (saveT > 5 && !sim){ saveT = 0; persist(); }
  } catch(err){
    if (!loggedErr){ loggedErr = true; console.error('Lantern Market frame error', err); }
  }
}
let sim = false;
render(); offlineReturn();
requestAnimationFrame(frame);
Portal.gameplayStart();

if (/[?&]debug\b/.test(location.search)) window.__lm = {
  get S(){ return S; }, set S(v){ S = v; }, STALLS, UPGRADES, update, takings, cycleTime, ratePerSec, totalRate, costFor, maxAffordable,
  buyLevels, hire, buyUpgrade, cook, moveCity, pendingFame, freshRun, render, fmt,
  setSim(v){ sim = v; }, get now(){ return now; },
};
})();
</script>
</body>
</html>
